# One entry per resource. Schema and field notes in docs/one-pager.md.
# tldr is the lesson, why is the context I was in when it resonated.

- title: How to Build AI Workflows with Claude Code
  url: https://www.producttalk.org/how-to-build-ai-workflows-with-claude-code/
  source: Product Talk (Teresa Torres)
  date_found: 2026-09-05
  skill_area: ai-tools
  format: essay
  stage: mid-build
  tldr: "A non-engineer can build working tools for discovery work with a coding agent by describing the workflow step by step. The skill is decomposing the task, not writing the code."
  why: "A concrete model for building my own PM tooling rather than waiting on engineering, which is the builder-PM direction I am working towards."
  revisit: true

- title: A Practical Guide to AI Evals
  url: https://www.producttalk.org/ai-evals/
  source: Product Talk (Teresa Torres)
  date_found: 2026-09-05
  skill_area: ai-evals
  format: essay
  stage: foundational
  tldr: "Judge an LLM feature's quality with a written eval set and a measured pass rate, not by feel, and iterate the prompt against that benchmark."
  why: "Evals are the clearest AI-lifecycle skill for the roles I want, and very few PMs can show the practice."
  revisit: true

- title: The Non-Technical PM's Guide to Building with Cursor
  url: https://www.lennysnewsletter.com/p/the-non-technical-pms-guide-to-building-with-cursor
  source: Lenny's Newsletter
  date_found: 2026-09-05
  skill_area: ai-tools
  format: newsletter
  stage: foundational
  tldr: "A non-technical PM can reach a working prototype in Cursor by treating the editor as a conversation and shipping in small steps. The barrier is starting, not ability."
  why: "Lowers the cost of prototyping an idea myself, which is the first move I want to default to on anything new."
  revisit: true

- title: Build vs Buy in the Age of AI
  url: https://www.svpg.com/article-build-vs-buy-in-the-age-of-ai/
  source: Silicon Valley Product Group (SVPG)
  date_found: 2026-09-05
  skill_area: product-strategy
  format: essay
  stage: foundational
  tldr: "AI lowers the cost of building, so revisit build-versus-buy calls, but keep deciding on whether the capability is core to your value rather than on how easy it has become to build."
  why: "A framework for a strategic call PMs increasingly own, and it holds the line against assuming that cheaper building means build everything."
  revisit: true

- title: 10 Usability Heuristics for User Interface Design
  url: https://www.nngroup.com/articles/ten-usability-heuristics/
  source: Nielsen Norman Group
  date_found: 2026-09-05
  skill_area: design-ux
  format: reference
  stage: foundational
  tldr: "Ten durable rules of thumb for finding usability problems in any interface, and a shared vocabulary for design critique."
  why: "A reference to check designs against, and a way to ground UX feedback in something firmer than personal taste."
  revisit: true

